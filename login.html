    <main class="contenedor-cuenta">
        <section class="titulo-cuenta">
            <h1>Mi Cuenta</h1>
            <p>Accede a tu panel para ver tus pedidos y datos personales.</p>
        </section>
        <div class="grid-autenticacion">
            <div class="caja-auth">
                <h2>Iniciar Sesión</h2>
                <form action="#" method="POST">
                    <div class="grupo-input">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" name="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="grupo-input">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-auth">INGRESAR</button>
                </form>
            </div>
            <div class="caja-auth">
                <h2>Crear Cuenta Nueva</h2>
                <form action="#" method="POST">
                    <div class="grupo-input">
                        <label for="reg-nombre">Nombre Completo</label>
                        <input type="text" id="reg-nombre" name="nombre" placeholder="Tu nombre..." required>
                    </div>
                    <div class="grupo-input">
                        <label for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="grupo-input">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" name="password" placeholder="Crea una contraseña" required>
                    </div>
                    <button type="submit" class="btn-auth secundario">REGISTRARME</button>
                </form>
            </div>
        </div>
    </main>
    <footer>

        </div>
    </footer>
</body>
